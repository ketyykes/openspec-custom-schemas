# GENERATED FILE — do not edit. Source of truth: openspec-custom-schemas/src/
# Rebuild: node src/build.mjs   |   Variant: tdd-subagent (mode=subagent, worktree=false)
name: tdd-subagent
version: 1
description: |
  TDD-disciplined workflow with subagent-driven execution and a single
  bounded review per group. Inlines a subagent-driven-development
  discipline: per-task fresh subagent dispatch, then one group review at
  each tasks.md group boundary — spec compliance and code quality as two
  sections of one report — with a bounded fix-loop (severity-tagged
  findings; at most 3 fix rounds per group, leftovers recorded and
  deferred). No worktree isolation.

  Inlined disciplines (self-contained; no external plugin required):
    - Test-first commitment via test-plan.md
    - RED -> GREEN -> REFACTOR enforcement inside each Implementer subagent
    - One review per tasks.md group (spec compliance + code quality, two
      sections, one reviewer) with a bounded fix-loop: findings tagged
      high / medium / low, the first review fixes every finding, re-reviews
      pass once no medium+ remains, at most 3 fix rounds per group,
      leftovers recorded under design.md `## Deferred Findings` instead of
      looping; groups must end spec-coherent
    - Final cross-group integration review after all groups complete
    - Per-role model selection recorded in execution-plan.md
    - Sized ASCII overview (incl. UI mockups, DB diagrams, sequence/migration flows)

  Output language is controlled by openspec/config.yaml `context:`
  (see OpenSpec docs/multi-language.md), not by this schema.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Why this change exists (Why / What / Capabilities / Impact)
    template: proposal.md
    instruction: |
      Create proposal.md that establishes WHY this change is needed.

      Sections (in order):
      - **Why**: 1-2 sentences on the problem or opportunity. Why now?
      - **What Changes**: Bullet list of concrete changes. Mark breaking changes with **BREAKING**.
      - **Capabilities**:
        - **New Capabilities**: List new capabilities (each maps to `specs/<name>/spec.md`).
          Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List capabilities whose REQUIREMENTS change.
          Implementation-only changes do not belong here.
        - Check `openspec/specs/` before naming to reuse existing capability names.
      - **Impact**: Affected code, APIs, dependencies, teams, external systems.

      The Capabilities section is the contract between proposal and specs phases.
      Every capability listed here MUST get a corresponding spec file.

      Keep it 1-2 pages. The "how" belongs in design.md, not here.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: WHAT — detailed specifications per capability
    template: spec.md
    instruction: |
      Create `specs/<capability>/spec.md` for each capability listed in the proposal.

      Delta operations (use ## headers exactly):
      - **ADDED Requirements**: New requirements
      - **MODIFIED Requirements**: MUST include the full updated content (not a diff)
      - **REMOVED Requirements**: MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Use FROM:/TO: format

      Requirement format:
      - `### Requirement: <name>` followed by description (use SHALL / MUST; avoid should/may)
      - Each requirement MUST have at least one Scenario
      - Scenario header MUST use exactly 4 hashtags (`####`). 3 hashtags or bullets fail silently.
      - Scenario body uses WHEN / THEN form

      MODIFIED workflow:
      1. Locate the existing requirement in `openspec/specs/<capability>/spec.md`
      2. Copy the entire block (from `### Requirement:` through all Scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Header text must match exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      ⚠️ Do NOT embed ASCII diagrams or visualizations in spec.md.
      All visuals belong in overview.md. spec.md must stay as pure requirement
      language so the validator can parse it correctly.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: HOW — technical design and decisions
    template: design.md
    instruction: |
      Create design.md to explain HOW to implement the change.
      Include only when any of these apply:
      - Cross-service / cross-module change or new architectural pattern
      - New external dependency or significant data model change
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y).
        Each decision MUST list alternatives considered.
      - **Risks / Trade-offs**: Format `[Risk] -> Mitigation`
      - **Migration Plan**: Deployment steps and rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns
      - **Deferred Findings**: leave empty at design time; apply appends
        review findings left unresolved after the fix budget (3 rounds)

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal (motivation) and specs (requirements).
    requires:
      - proposal

  - id: test-plan
    generates: test-plan.md
    description: TDD pre-commitment — which tests cover each requirement, and why first
    template: test-plan.md
    instruction: |
      Create test-plan.md. **This is the RED-phase commitment document.
      Do NOT describe implementation logic here.**

      For each requirement in specs:
      - List 1-N test names in imperative form
        (e.g., `user_can_export_csv`, `export_rejects_when_no_users_selected`)
      - Map each test explicitly to a Scenario (####)
      - State the expected assertion: what input -> what output / state change / error
      - State why this test must be written first (golden path? edge case? regression guard?)

      Format (one block per capability):
      ```
      ## <capability-name>

      ### Requirement: <requirement-name>

      | Test name | Scenario | Assertion | Why first | Tier |
      |-----------|----------|-----------|-----------|------|
      | test_x | Scenario A | input ... -> output ... | golden path | unit |
      ```

      The `Tier` column is REQUIRED for every test row (values: unit | integration | e2e).
      Mixing unit and integration in one row is not allowed; split into separate rows.

      Validation checks:
      - Every requirement has at least one test
      - Every Scenario has at least one test
      - Every row has a Tier value

      This file is read repeatedly during apply as the source of "what to RED next".
    requires:
      - specs

  - id: overview
    generates: overview.md
    description: ASCII 人類版摘要；依 change 規模與類型動態決定區塊
    template: overview.md
    instruction: |
      建立 overview.md，給人類一頁讀完此 change。
      **所有 ASCII 圖必須包在 ``` 三引號程式碼區塊內。**
      Apply 階段不必讀此檔；validator 也不解析它。

      ─── 步驟 1：判定 change 規模（取最大命中）───
      - **small**：影響 ≤1 capability、預估 tasks ≤8、無新依賴、無架構變更
      - **medium**：影響 2-3 capabilities、tasks 9-20、或新增一個模組
      - **large**：影響 ≥4 capabilities、tasks >20、或跨服務 / 含資料遷移

      ─── 步驟 2：判定條件式區塊（逐一檢查，命中就必加，不分規模）───
      - **前端需求 → UI Mockups**：specs 內有任一 requirement 描述
        使用者介面、互動、版面、視覺狀態。
      - **資料庫結構 → Data Model**：涉及新 table、欄位增刪改、索引、
        關聯變更或任何 schema migration。
      - **資料遷移 → Data Migration**：除 schema 變更外，還需搬移或
        轉換既有資料（backfill、格式轉換、拆表併表）。
      - **跨元件流程 → Sequence Diagram**：流程含非同步任務、webhook、
        排程、多服務協作，或順序敏感的多步互動；
        單純同步 CRUD（前端→API→DB 一來一回）不算。

      ─── 步驟 3：依下表組合區塊 ───

      | 區塊 | small | medium | large | 條件 |
      |------|:-----:|:------:|:-----:|------|
      | Scope            | ✅ | ✅ | ✅ | 永遠 |
      | What Changes     | ✅ | ✅ | ✅ | 永遠 |
      | UI Mockups       | (條件) | (條件) | (條件) | 含前端需求時 |
      | Data Model       | (條件) | (條件) | (條件) | 動到資料庫結構時 |
      | Data Migration   | (條件) | (條件) | (條件) | 含資料遷移時 |
      | Architecture     | — | ✅ | ✅ | medium 起 |
      | Sequence Diagram | (條件) | (條件) | (條件) | 含跨元件流程時 |
      | Task Tree        | — | — | ✅ | large 起 |
      | Cross-Cutting Impact | — | — | ✅ | large 起 |

      ─── 步驟 4：各區塊內容規範 ───

      ## Scope
        - 兩三句白話描述
        - 規模判定結果（small / medium / large）+ 一句理由
        - 各條件式區塊（前端 / DB 結構 / 資料遷移 / 跨元件流程）
          的判定結果 + 各一句理由

      ## What Changes
        - 條列（同 proposal 的 What Changes，但更精簡）
        - 一個 ``` ASCII 區塊：before / after 對照（純文字、無 UI 細節）

      ## UI Mockups（含前端需求時）
        依下列繪製慣例輸出多個 state：

        ─── ASCII UI 繪製慣例 ───
        - 容器邊框：┌─┐ │ └─┘
        - 按鈕：[Label]、[Label ▾]（含下拉）、[Cancel]（次要）
        - Radio：( ) 未選、(●) 已選
        - Checkbox：[ ] 未勾、[x] 已勾
        - 輸入框：[___________] 空、[value] 有值
        - 下拉：[value ▼]
        - Disabled：後綴 ░░░░ 或前綴 (disabled)
        - 互動箭頭：│ │ ▼ 表示 A 觸發 B
        - 狀態切換：=== State N: <描述> === 標題分區
        - 標註：行末對齊 ← 註解

        必含：
        - 至少 before 與 after 兩個 state（除非是純新增頁面）
        - 每個關鍵互動觸發的 state（modal、disabled、error、loading）
        - 多 state 用 === State N === 分區、用 │ ▼ 表示觸發順序

      ## Data Model（動到資料庫結構時）
        Before / After 兩張 ``` ASCII 關聯圖：

        ─── ASCII 關聯圖繪製慣例 ───
        - table：┌─ table_name ─┐ 邊框，欄位一行一個
        - 主鍵後綴 PK、外鍵後綴 FK
        - 關聯線：1───1、1───N、N───M（基數標在線的兩端）
        - 範圍：受影響 table 展開全部欄位；與其有直接 FK 關聯的鄰居
          table 只畫名稱框（欄位以 (…) 代替），不再向外擴一層
        - === Before === / === After === 分區；
          純新增 table 且無既有關聯時可只畫 After

      ## Data Migration（含資料遷移時）
        一個 ``` 區塊，依序四段：
        - === 資料形狀 Before ===：遷移前欄位 / 格式（可附一筆範例資料）
        - === 遷移步驟 ===：編號步驟，標明批次策略與雙寫 / 切讀時機
        - === 資料形狀 After ===：遷移後欄位 / 格式
        - === Rollback ===：每個步驟可否回滾、如何回滾

      ## Architecture（medium 起）
        - 一個 ``` ASCII 區塊：元件 / 資料流 / 依賴關係
        - 用方塊 + 箭頭表示模組與資料流向

      ## Sequence Diagram（含跨元件流程時）
        一個 ``` ASCII 時序圖：

        ─── ASCII 時序圖繪製慣例 ───
        - 參與者橫排在頂，底下接垂直生命線 │
        - 時間由上而下
        - 同步請求：──►；回應：◄──；非同步 / 事件：╌╌►
        - 訊息標籤寫在箭頭同行或上一行
        - 只畫關鍵路徑與失敗分支，不畫逐行程式細節

      ## Task Tree（large 起）
        - 一個 ``` ASCII 區塊：tasks.md 的依賴樹
        - 用縮排或 ├── └── 表示父子關係

      ## Cross-Cutting Impact（large 起）
        - 一個 ``` 區塊或 markdown 表格：受影響檔案 / 模組矩陣

      ─── 共通要求 ───
      - 每個 ASCII 區塊前用一兩句中文說明它在表達什麼
      - ASCII 寬度不超過 80 字元（terminal 友善）
      - 不使用全形空格與全形括號（會破壞對齊）
    requires:
      - specs

  - id: execution-plan
    generates: execution-plan.md
    description: Subagent dispatch plan — review unit, per-task contract, roles, model selection, review-findings contract (severity + fix budget)
    template: execution-plan.md
    instruction: |
      Create execution-plan.md to declare how subagents execute the tasks.

      Sections (in order):
      - **Mode**: must be `subagent-driven`.
      - **Review unit**: the tasks.md `##` group. Implementation is dispatched
        per task; one group review (spec compliance + code quality, two
        sections of a single report by a single reviewer) runs once per group
        at the group boundary (mid-group states are legitimately intermediate
        and are not reviewed). Record the two planning rules groups must
        satisfy: every group ends in a spec-coherent state, and stays within
        3 RED/GREEN pairs.
      - **Per-task contract**: list exactly what each dispatched subagent receives.
        Subagents do not inherit the main conversation context, so this contract
        is what they get. Required entries:
        - Full task text from tasks.md (RED + GREEN pair)
        - Matching entry in test-plan.md (test name / scenario / assertion / why first / tier)
        - Relevant spec.md section (the capability's requirement + scenarios)
        - Relevant design.md section (decisions / risks affecting this task)
        - For an intermediate-state task: one line naming which later task in
          the group consumes its output, and how
        - Explicit "not given" list (other groups' tasks, unrelated capability specs)
        - Worktree path from environment.md (only if this schema includes an
          environment artifact — worktree variants)
      - **Roles**: three roles, each with default_model + rationale + review checklist:
        - **Implementer** (default_model: `haiku`); list upgrade triggers
          (`upgrade_to_sonnet_when`, `upgrade_to_opus_when`).
        - **Group Reviewer** (default_model: `opus`); reviews one group's
          combined diff and returns one report with two sections, in order.
          Section A — Spec compliance: requirement coverage of the capability,
          scope creep, RED → Scenario mapping per task, no intermediate state
          left dangling at the group boundary; never comments on
          naming/structure/quality. Section B — Code quality: idioms,
          duplication (including between the group's tasks), edge cases,
          error handling, readability; never re-litigates whether the spec
          is right. Every finding carries a severity tag, belongs to exactly
          one section, and names the task number(s) it concerns.
        - **Final Code Reviewer** (default_model: `opus`); after all groups
          complete, reviews the full set of commits for cross-group integration:
          naming/pattern consistency across groups, duplicated logic introduced
          by separate groups, combined diff staying within the proposal's scope.
          Also receives design.md's `## Deferred Findings` list and gives a
          verdict per entry (stands / resolved / false positive); verdicts
          are not findings and trigger no fix round. Never re-reviews
          single-group details beyond that (the group review covered those).
      - **Review findings**: the contract every reviewer (group review / Final
        review) reports against; the orchestrator pastes this section into
        every reviewer dispatch.
        - Severity scale — each finding carries exactly one tag:
          - `high`: spec requirement missing or violated; wrong behavior; a
            RED test that does not map to its Scenario; data loss, security,
            or crash path
          - `medium`: partial coverage; scope creep; unhandled edge case;
            duplication that will diverge; misleading naming or error handling
          - `low`: style, readability, cosmetic, optional improvement
        - Pass rule (k = fix rounds already used): the first review (k = 0)
          passes only with zero findings of any severity in either section —
          a low-only list still triggers fix round 1. A re-review (k ≥ 1)
          passes with zero `medium` / `high` findings in either section;
          leftover `low` findings are recorded, never fixed on their own.
        - Fix budget: 3 fix rounds per group, shared by both sections (Final
          review: 3 rounds total). Round 1 fixes every finding at the
          Implementer default model; rounds 2-3 fix `medium` / `high` (`low`
          optional) at one tier up, then the strongest tier. A re-review
          receives the previous findings and marks each resolved / unresolved
          first; new findings count against the same budget.
        - Budget exhausted with `medium` / `high` remaining → the orchestrator
          records them under `## Deferred Findings` in design.md and proceeds;
          there is never a 4th round.
      - **Escalation**:
        - Fix rounds are bounded by the Review findings budget above; model
          upgrades happen per round, never as "one more try" past round 3.
        - Section A's judgment is inconsistent (e.g., flips verdicts between
          rounds on unchanged code) → escalate to a human for spec
          clarification.
        - Section B vs. Implementer style disagreement → existing codebase style wins.
        - Any review BLOCKED for over 30 minutes → escalate to a human.

      Model selection principle:
      use the least powerful model that can handle each role to conserve cost
      and increase speed. Model names (haiku / sonnet / opus) are Claude tiers
      used as examples; on hosts without them, map to the closest
      fast / balanced / strongest equivalents.

      This file is read on every dispatch during apply to assign models; keep
      it accurate after any task or group is added or removed.
    requires:
      - test-plan

  - id: tasks
    generates: tasks.md
    description: Implementation checklist; enforces RED / GREEN / (REFACTOR) structure
    template: tasks.md
    instruction: |
      Create tasks.md. **Apply parses `- [ ]` checkboxes to track progress.
      Wrong format = no tracking.**

      ─── Mandatory structure ───
      Every implementation task MUST be preceded by a corresponding test task.
      Naming prefix:
      - `X.Y RED: <test name>` → write the test named in test-plan.md (must fail first)
      - `X.Y+1 GREEN: <implementation>` → write the minimum code to pass
      - `X.Y+2 REFACTOR: <description>` → optional

      ## Grouping
      - Group by capability or subsystem
      - Order within group follows dependency
      - Cross-group dependencies: state `Depends on: §N` on the line under the group header
      - Review runs per group (`##` section), not per task: every group must
        end in a spec-coherent state — no dangling intermediate state (e.g.,
        a helper nothing in the group consumes) at the group boundary
      - Keep groups reviewable: at most 3 RED/GREEN pairs per group

      ─── Example ───
      ```
      ## 1. CSV Export Core

      - [ ] 1.1 RED: write test `export_returns_csv_with_headers`
      - [ ] 1.2 GREEN: implement CsvExporter.export()
      - [ ] 1.3 RED: write test `export_handles_unicode`
      - [ ] 1.4 GREEN: extend CsvExporter to encode UTF-8
      - [ ] 1.5 REFACTOR: extract header logic into helper

      ## 2. UI Wiring
      Depends on: §1

      - [ ] 2.1 RED: write test `export_button_visible_on_user_list`
      - [ ] 2.2 GREEN: add Export CSV button to UserList
      ```

      ─── Forbidden ───
      - Two GREEN tasks without a RED between them
      - A standalone "implement X" task with no corresponding test
      - Mixing test + impl description in one checkbox
    requires:
      - specs
      - test-plan
      - execution-plan
      - design

apply:
  requires: [proposal, specs, design, test-plan, execution-plan, tasks]
  tracks: tasks.md
  instruction: |
    Process every unchecked checkbox in tasks.md in order.
    **The review unit is the tasks.md `##` group, not the single task:
    implementation is dispatched per task, but one group review (spec
    compliance + code quality, two sections of one report) runs once per
    group, at the group boundary. Do not reorder, skip, or merge.
    (REFACTOR-only groups run a reduced flow — see below.)**

    Commit behavior assumes the agent host has git permission. If commits
    cannot be made, the discipline degrades to in-memory steps; do not skip
    the test-first sequencing regardless.

    ─── Review findings: severity, pass rule, fix budget ───
    Every reviewer (group review, Final review) tags each finding with
    exactly one severity — `high` / `medium` / `low` — using the scale in
    execution-plan.md's "Review findings" section, and names the task
    number(s) it concerns. Paste that scale into every reviewer dispatch.
    - k = fix rounds already used for this group (0 at the first review);
      both sections of the group report share the same k.
    - PASS, first review (k = 0): zero findings of any severity in either
      section. Even a low-only list triggers fix round 1 — low findings
      get exactly one guaranteed fix attempt.
    - PASS, re-review (k ≥ 1): zero medium/high findings in either
      section. Leftover low findings are recorded (see "Recording deferred
      findings") and never trigger another fix round; if a fix round runs
      anyway for medium/high, hand them to the Implementer as optional
      items.
    - FAIL = anything else → one fix round, if budget remains.
    - Fix budget: 3 rounds per group, spec and quality findings together
      (Final review: 3 rounds total). One round = one fresh Implementer
      dispatched with the findings list from both sections (round 1: every
      finding; rounds 2-3: medium/high mandatory, low optional) and the
      affected tasks' context, then a re-review by a fresh Group Reviewer.
      Model per round: round 1 = Implementer default model; round 2 = one
      tier up; round 3 = strongest tier.
    - Re-review contract: the reviewer also receives the previous round's
      findings and must first mark each one resolved / unresolved before
      adding anything new. New findings are allowed but count against the
      same budget; nothing resets the counter.
    - Budget exhausted with medium/high findings remaining → do NOT
      dispatch a 4th fix. Record the remaining findings as deferred, treat
      the review as passed-with-deferred, and proceed exactly as if it had
      passed. This is the hard stop against reviewer / fix churn.
    - A reviewer that returns findings without severity tags, or without
      the two-section layout, is redispatched once to fix the report (this
      does not consume a round).

    ─── Recording deferred findings ───
    Append to design.md under `## Deferred Findings` (create the section at
    the end of the file if absent), one line per finding:
    `- [<severity>] §<group> / <section> / round <k>: <finding> (task X.Y)`
    `<section>` is `spec` or `quality` for a group review, `final` for the
    Final review (whose group is `all`); k is the round of the review that
    ended the loop (leftover low findings at a passing re-review use that
    re-review's k). This list is handed to the Final Code Reviewer (Step 9)
    and reported to the user at the end of apply (Step 11).

    ─── Per Group: coherence pre-flight ───
    1. Identify the current group: the next `##` section in tasks.md with
       unchecked boxes. Confirm it ends in a spec-coherent state: the
       group's tasks combined leave no dangling intermediate state (e.g.,
       a helper nothing inside the group consumes). If the coherent point
       lies in a later group, stop and fix the grouping in tasks.md (a
       planning fix, not a code fix) before dispatching anything. A group
       should stay within 3 RED/GREEN pairs.
    2. Note the current commit hash as the group's review base; the group
       diff reviewed in Steps 6-8 is everything committed after it.

    ─── Per Task (inside the group): dispatch Implementer ───
    3. Read execution-plan.md for the Implementer's default_model and upgrade triggers.
    4. Dispatch a fresh subagent as Implementer with:
       - The complete text of the task from tasks.md (the RED + GREEN pair)
       - The matching entry from test-plan.md (test name / scenario / assertion / why first)
       - The relevant spec.md section (only the capability this task touches)
       - The relevant design.md section (decisions and constraints affecting this task)
       - If the task produces an intermediate state (something only a later
         task in this group consumes), one line naming that consumer task
         and how it will consume it (so the interface lines up)
       - Explicit instruction: write the RED test → run tests, see it fail
         → write minimum GREEN implementation → run tests, see it pass
         → self-review → commit
    5. Implementer reports status:
       - DONE: dispatch the next task in the group; after the group's last
         task, proceed to Step 6 (group review).
       - DONE_WITH_CONCERNS: read concerns. If they are about correctness or scope,
         resolve before continuing. If they are observational (e.g., "this file grew
         big"), log and continue.
       - NEEDS_CONTEXT: supply the missing context; redispatch with the same model.
       - BLOCKED: follow escalation rules — context gap → add context;
         reasoning gap → upgrade model; task too big → split; plan wrong → escalate.
         Never redispatch the same model under the same conditions.
       Do not check off any box yet — boxes are checked only after the
       group review passes (or defers).

    ─── Per Group: review (spec compliance + code quality) ───
    6. When every task in the group reports DONE, dispatch a fresh subagent
       as Group Reviewer (model per execution-plan.md) over the group's
       combined diff (all commits since the review base). It receives the
       group's full task texts, the matching test-plan entries, the
       relevant spec / design sections, the severity scale, and (on a
       re-review) the previous round's findings.
       Required first action for the reviewer: restate the section headings of
       the spec / test-plan excerpts it received; if they do not match the group
       under review, report NEEDS_CONTEXT instead of reviewing (the orchestrator
       reassembles the context and redispatches).
    7. Sole task: one report with two sections, in this order, every
       finding tagged with severity and the task number(s) it concerns.
       - Section A — Spec compliance: answer "does the code match the
         spec?" Look at requirement coverage of the capability, scope
         creep, RED → Scenario mapping for each task, and whether every
         intermediate state inside the group got consumed by the group's
         end. Do NOT comment on naming, structure, or quality here.
       - Section B — Code quality: naming, duplication (including between
         this group's tasks), edge cases, error handling, readability,
         consistency with existing style. Do NOT re-litigate whether the
         spec is right here.
       Keep the sections separate; a finding belongs to exactly one.
    8. Apply the pass rule (k = fix rounds already used for this group):
       ✅ PASS (k = 0: no findings at all; k ≥ 1: no medium/high in either
          section) → record any leftover low findings (round k); check off
          every box in the group; proceed to the next group (back to Step 1).
       ❌ FAIL, k < 3 → one fresh Implementer (model for round k+1) fixes
          the findings of both sections (round 1: all of them; later
          rounds: medium/high, low optional) → back to Step 6 as a
          re-review.
       ⏭ FAIL, k = 3 → record the remaining medium/high findings as
          deferred (round 3); check off every box in the group; proceed to
          the next group. No 4th fix.

    ─── REFACTOR tasks ───
    Dispatch a fresh Implementer per REFACTOR task like any other task in
    its group, with this contract instead: refactor only, no behavior
    change, full test suite stays green, commit `refactor: <description>`.
    At the group boundary its commits are covered by Section B; Section A
    findings must not target them (no spec-visible behavior may change).
    For a group made up solely of REFACTOR tasks the reviewer fills
    Section B only and states "no spec-visible change" in Section A.

    ─── After all groups complete ───
    9. Dispatch a fresh subagent as Final Code Reviewer (model and checklist
       per execution-plan.md) over the full set of commits to confirm
       cross-group integration is consistent. It also receives the severity
       scale and the current `## Deferred Findings` list from design.md,
       and must give a verdict per deferred entry — stands / resolved /
       false positive. Verdicts are not Final findings and never trigger a
       fix round; they only annotate the list.
    10. Apply the pass rule (k = Final fix rounds already used):
        ✅ PASS (k = 0: no findings at all; k ≥ 1: no medium/high) → record
           any leftover low findings (group `all`, section `final`, round
           k); proceed to Step 11.
        ❌ FAIL, k < 3 → one fresh Implementer (model for round k+1) fixes
           the findings (round 1: all of them; later rounds: medium/high,
           low optional) → back to Step 9 as a re-review.
        ⏭ FAIL, k = 3 → record the remaining medium/high findings as
           deferred (group `all`, section `final`, round 3); proceed to
           Step 11.
        Then append the reviewer's verdict to each `## Deferred Findings`
        entry (`→ stands` / `→ resolved` / `→ false positive`).
    11. Report back to the user: groups completed, and the full
        `## Deferred Findings` list (or "none"). Any entry marked `high`
        and `→ stands` must be called out at the top of the report. Then
        apply is done.

    ─── Forbidden ───
    - Dispatching multiple Implementer subagents in parallel (they will conflict)
    - Reviewing mid-group "for safety" (mid-group states are legitimately
      intermediate; per-task review re-creates the false-positive churn the
      group boundary exists to remove)
    - Skipping the group review at a group boundary (REFACTOR-only groups
      still get Section B)
    - Splitting the group review back into two separate reviewer dispatches
      (one Group Reviewer, one report, two sections, one shared budget)
    - Letting Section A comment on naming/structure, or Section B re-litigate
      the spec (each section stays in its lane)
    - Checking off any box before its group review passes (or defers)
    - Moving to the next group with a medium/high finding that is neither
      fixed nor recorded under `## Deferred Findings` (fix or record —
      never neither)
    - Running a 4th fix round on any group or on the Final review (the
      budget is 3; defer instead)
    - Passing a first review (k = 0) that still lists any finding, low included
    - Failing a re-review (k ≥ 1), or dispatching a fix round after round 1,
      over low findings only
    - Accepting reviewer findings that carry no severity tag or no section
    - Letting the Implementer's self-review replace group review (both are required)
    - Waving through "close enough" spec deviations while fix budget remains
      (deferring after round 3 is a recorded decision, not a wave-through)
    - Redispatching a BLOCKED task with the same model under the same conditions
    - Letting any subagent read plan files directly (always paste the full task text)
    - Dispatching into a group that failed the coherence pre-flight
      (fix the grouping first)

    ─── When blocked ───
    - Stop. Record the blocker under `## Open Questions` in design.md.
    - Report back to the user.
    - Do not simplify tests or skip verification to make progress.
